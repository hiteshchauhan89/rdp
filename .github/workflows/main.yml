
name: AZURE RDP WITH IDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Validate Required Secrets
        shell: pwsh
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          foreach ($name in @(
            "RDP_USERNAME",
            "RDP_PASSWORD",
            "TAILSCALE_AUTH_KEY"
          )) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Required GitHub secret is missing or empty: $name"
            }
          }

          if ($env:RDP_USERNAME -notmatch '^[a-zA-Z0-9_.-]{1,20}$') {
            throw "RDP_USERNAME must be a simple local Windows username."
          }

          if ($env:RDP_PASSWORD.Length -lt 14) {
            throw "Use a strong RDP password of at least 14 characters."
          }

          Write-Host "Required secrets are present."

      - name: Configure RDP Securely
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name SecurityLayer -Value 2

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Manual
          Start-Service -Name TermService

          Write-Host "RDP enabled with NLA and TLS security settings."

      - name: Create Local RDP User
        shell: pwsh
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if (-not $user) {
            New-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword `
              -Description "Temporary RDP account"
          } else {
            Set-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Join-Path $env:TEMP "tailscale-setup.msi"
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
            -Wait -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed with exit code $($process.ExitCode)."
          }

          $tailscale = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable was not found."
          }

          Write-Host "Tailscale installed."

      - name: Connect to Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $tailscale = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"

          & $tailscale up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale failed to connect."
          }

          $ip = $null

          for ($i = 0; $i -lt 12; $i++) {
            $candidate = (& $tailscale ip -4 2>$null | Select-Object -First 1)

            if ($candidate -match '^\d{1,3}(\.\d{1,3}){3}$') {
              $ip = $candidate.Trim()
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $ip) {
            throw "No Tailscale IPv4 address was assigned."
          }

          "TAILSCALE_IP=$ip" | Out-File `
            -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale IPv4 address assigned: $ip"

      - name: Verify RDP Listener
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $listener = Get-NetTCPConnection `
            -State Listen -LocalPort 3389 `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            throw "No process is listening on TCP port 3389."
          }

          Write-Host "An RDP listener is present on TCP port 3389."

          $service = Get-Service TermService

          if ($service.Status -ne "Running") {
            throw "Remote Desktop Services is not running."
          }

          Write-Host "Remote Desktop Services is running."

      - name: Display Connection Details
        shell: pwsh
        run: |
          Write-Host "Temporary runner hostname: $env:COMPUTERNAME"
          Write-Host "Tailscale address: $env:TAILSCALE_IP"
          Write-Host "Username: configured in repository secrets"
          Write-Host "Password: not displayed"
          Write-Host "The runner is temporary and exists only during this job."
